<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Laural's Haven Admin Console</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="adminAuth" class="admin-auth">
      <div class="auth-panel">
        <p class="eyebrow">Admin access</p>
        <h2>Enter password</h2>
        <form id="adminLoginForm" class="auth-form">
          <input id="adminPassword" type="password" placeholder="Password" autocomplete="current-password" required />
          <button type="submit" class="refresh-button auth-button">Unlock console</button>
        </form>
        <p id="authError" class="auth-error" aria-live="polite"></p>
      </div>
    </div>

    <div id="dashboardShell" class="dashboard-shell hidden-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Operations hub</p>
          <h1>Laural's Haven</h1>
        </div>
        <div class="topbar-actions">
          <span class="live-pill">Live kitchen</span>
          <button id="refreshButton" class="refresh-button" type="button">Refresh board</button>
        </div>
      </header>

      <main class="main-grid">
        <section class="stats-grid">
          <article class="stat-card revenue">
            <span>Total revenue</span>
            <strong id="totalRevenue">₹0</strong>
          </article>
          <article class="stat-card">
            <span>Orders today</span>
            <strong id="totalOrders">0</strong>
          </article>
          <article class="stat-card warning">
            <span>Pending</span>
            <strong id="pendingOrders">0</strong>
          </article>
          <article class="stat-card success">
            <span>Delivered</span>
            <strong id="deliveredOrders">0</strong>
          </article>
        </section>

        <section class="panel panel-wide">
          <div class="panel-header">
            <div>
              <p>Restaurant flow</p>
              <h2>Live order queue</h2>
            </div>
          </div>
          <div id="ordersTable" class="orders-table" aria-live="polite"></div>
        </section>

        <section class="panel report-panel">
          <div class="panel-header">
            <div>
              <p>Performance</p>
              <h2>Best sellers</h2>
            </div>
          </div>
          <ul id="popularItems" class="popular-items"></ul>
        </section>
      </main>
    </div>

    </div>

    <script>
      // Set this to the deployed backend URL before publishing the admin console.
      // Example: window.LH_API_BASE = 'https://your-backend-service.onrender.com';
      window.LH_API_BASE = window.LH_API_BASE || '';
    </script>
    <script src="./app.js"></script>
  </body>
</html>
