name: Owner daily report

on:
  workflow_dispatch:
    inputs:
      date:
        description: 'Report day in YYYY-MM-DD (IST). Leave empty for today.'
        required: false
  schedule:
    # 18:29 UTC is 23:59 IST
    - cron: '29 18 * * *'

concurrency:
  group: daily-report
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      READY: ${{ (secrets.GMAIL_REFRESH_TOKEN != '' || secrets.GMAIL_APP_PASSWORD != '') && secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
    steps:
      - name: Secrets not configured yet
        if: env.READY != 'true'
        run: echo "Add GMAIL_CLIENT_ID, GMAIL_CLIENT_SECRET, GMAIL_REFRESH_TOKEN and FIREBASE_SERVICE_ACCOUNT as repository secrets to enable the report."
      - uses: actions/checkout@v4
        if: env.READY == 'true'
      - uses: actions/setup-node@v4
        if: env.READY == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mailer/package-lock.json
      - name: Install
        if: env.READY == 'true'
        working-directory: mailer
        run: npm ci --omit=dev --no-audit --no-fund
      - name: Email the report
        if: env.READY == 'true'
        working-directory: mailer
        run: node report.js
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          REPORT_DATE: ${{ inputs.date }}
